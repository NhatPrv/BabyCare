version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: babycare-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: babycare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: babycare-app
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/babycare
      - START_MODEL_SERVICE=1
      - MODEL_SERVICE_PORT=8001
      - PYTHON_BIN=/app/.venv/bin/python
    depends_on:
      - db

volumes:
  postgres_data:
